<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>flow</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <pre id="out">running</pre>
  <script src="js/engine.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/bank.js"></script>
  <script src="js/physics_topics.js"></script>
  <script src="js/sci_topics.js"></script>
  <script src="js/sightwords.js"></script>
  <script src="js/wordmatch.js"></script>
  <script src="js/astronomy.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/art.js"></script>
  <script src="js/sci_art.js"></script>
  <script src="js/sci_animals.js"></script>
  <script src="js/sci_living.js"></script>
  <script src="js/math_mix.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var fails = [];
      function assert(cond, msg) { if (!cond) fails.push(msg); }
      // A thrown error fails the run at once instead of leaving the page waiting.
      window.addEventListener("error", function (e) {
        document.title = "FAIL";
        var o = document.getElementById("out");
        if (o) o.textContent = "FAIL exception: " + (e && e.message) + "\n" + fails.join("\n");
      });
      function samePage(label) {
        Merit.appTest.start(label);
        var before = Merit.appTest.state();
        if (app.querySelector("[data-act=flash-yes]")) {
          var word = before.word;
          var card = app.querySelector(".flash-word");
          assert(card && card.textContent === word, label + " shows the word");
          assert(!app.querySelector("[data-act=pick]"), label + " has no answer choices");
          assert(app.querySelector("[data-act=flash-hear]"), label + " has a hear button");
          app.querySelector("[data-act=flash-hear]").click();
          assert(Merit.appTest.state().index === before.index, label + " hear stays on the card");
          assert(Merit.appTest.state().word === word, label + " hear keeps the word");
          assert(app.querySelector("[data-act=flash-no]"), label + " has an Incorrect button");
          app.querySelector("[data-act=flash-no]").click();
          assert(Merit.appTest.state().index === before.index + 1, label + " incorrect moves on");
          assert(Merit.appTest.state().pct === 0, label + " incorrect counts");
          // Reading word skills now mix flash cards with listen-and-find (word-length ladder).
          assert(app.querySelector(".flash-word") || app.querySelector("[data-act=pick]"), label + " incorrect stays on a card");
          if (app.querySelector("[data-act=flash-yes]")) app.querySelector("[data-act=flash-yes]").click();
          else {
            app.querySelector('[data-act=pick][data-id="' + Merit.appTest.state().correctId + '"]').click();
            Merit.appTest.flushTimer(); Merit.appTest.flushTimer();
          }
          assert(Merit.appTest.state().index === before.index + 2, label + " correct moves on");
          assert(Merit.appTest.state().pct === 50, label + " correct counts");
          assert(app.querySelector(".flash-word") || app.querySelector("[data-act=pick]"), label + " stays on a flash card or listen-and-find");
          assert(!app.querySelector("[data-act=next]"), label + " has no result page");
          return;
        }
        var picks = app.querySelectorAll("[data-act=pick]");
        if (!picks.length || !before.correctId) {
          var kept = before.prompt;
          if (app.querySelector("[data-act=drive]") && Merit.appTest.state().robot) {
            // v25 robot puzzle: drive it with the keyboard and the arrow buttons (plan mode: then Go).
            var rmoves = Merit.appTest.state().moves || [];
            var rkey = { R: "ArrowRight", L: "ArrowLeft", U: "ArrowUp", D: "ArrowDown" };
            document.dispatchEvent(new KeyboardEvent("keydown", { key: rkey[rmoves[0]], bubbles: true, cancelable: true }));
            for (var rm = 1; rm < rmoves.length; rm++) app.querySelector('[data-act=drive][data-dir="' + rmoves[rm] + '"]').click();
            if (Merit.appTest.state().robot.mode === "plan") {
              app.querySelector("[data-act=robot-go]").click();
              for (var rf = 0; rf < 40 && Merit.appTest.state().robot && Merit.appTest.state().robot.running; rf++) Merit.appTest.flushTimer();
              Merit.appTest.flushTimer();
            }
            assert(app.querySelector(".result-correct"), label + " robot reaches the star (" + rmoves.join("") + ")");
            assert(Merit.appTest.state().pct === 100, label + " robot solve counts as right");
            Merit.appTest.correctAndNext();
            return;
          }
          if (app.querySelector("[data-act=drive]")) {
            var moves = Merit.appTest.state().moves || [];
            var keyFor = { R: "ArrowRight", L: "ArrowLeft", U: "ArrowUp", D: "ArrowDown" };
            assert(moves.length >= 2, label + " has a path to the star");
            var bumpDir = "U";
            ["U", "L", "D", "R"].forEach(function (d) { if (d !== moves[0]) bumpDir = d; });
            var bumpBtn = app.querySelector('[data-act=drive][data-dir="' + bumpDir + '"]');
            if (bumpBtn) bumpBtn.click();
            assert(app.querySelector(".result-x"), label + " a wall stops the square");
            assert(Merit.appTest.state().pct === 0, label + " a bump counts as incorrect");
            assert(Merit.appTest.state().phase === "ask", label + " stays on ask after a bump");
            assert(Merit.appTest.state().prompt === kept, label + " stays on the question");
            assert(!app.querySelector("[data-act=next]"), label + " does not open Next");
            assert(!app.querySelector("[data-act=show-why]"), label + " does not open a result page");
            if (moves.length) {
              document.dispatchEvent(new KeyboardEvent("keydown", { key: keyFor[moves[0]], bubbles: true, cancelable: true }));
              for (var m = 1; m < moves.length; m++) {
                var stepBtn = app.querySelector('[data-act=drive][data-dir="' + moves[m] + '"]');
                if (stepBtn) stepBtn.click();
              }
            }
            assert(app.querySelector(".result-correct"), label + " the square on the star is Correct");
            assert(app.querySelector(".cell.rover.goal"), label + " the square is on the star");
            assert(Merit.appTest.state().pct === 50, label + " the landing counts with the miss");
            assert(Merit.appTest.state().prompt === kept, label + " question stays up");
            assert(app.querySelectorAll(".cell.rover").length === 1, label + " only one square moves");
            Merit.appTest.correctAndNext();
            return;
          }
          if (app.querySelector("[data-act=cell-go]")) {
            var cell = app.querySelector("[data-act=cell]");
            if (cell) cell.click();
            var cellGo = app.querySelector("[data-act=cell-go]");
            if (cellGo && !cellGo.disabled) cellGo.click();
          }
          assert(Merit.appTest.state().prompt === kept, label + " stays on the question");
          assert(!app.querySelector("[data-act=next]"), label + " does not open Next");
          assert(!app.querySelector("[data-act=show-why]"), label + " does not open a result page");
          assert(app.querySelector(".result-x") || app.querySelector(".result-correct"), label + " shows Correct or an X");
          if (app.querySelector(".result-correct")) Merit.appTest.correctAndNext();
          return;
        }
        var wrong = null;
        for (var i = 0; i < picks.length; i++) {
          if (picks[i].getAttribute("data-id") !== before.correctId) wrong = picks[i];
        }
        if (label === "science") assert(picks.length >= 2, "engineering has answers to read");
        assert(wrong, label + " has another choice");
        if (!wrong) return;
        wrong.click();
        assert(Merit.appTest.state().phase === "ask", label + " stays on ask");
        assert(Merit.appTest.state().prompt === before.prompt, label + " keeps the same prompt");
        assert(Merit.appTest.state().pct === 0, label + " miss counts on the report");
        assert(app.querySelector(".result-x"), label + " shows an X");
        if (label === "science") assert(!app.querySelector(".choice.speaking"), "engineering stops highlighting after an answer");
        assert(!app.querySelector("[data-act=next]"), label + " does not show Next");
        assert(!app.querySelector("[data-act=show-why]"), label + " does not show why");
        var right = app.querySelector('[data-act=pick][data-id="' + before.correctId + '"]');
        assert(right, label + " right choice stays");
        if (!right) return;
        right.click();
        assert(Merit.appTest.state().pct === 50, label + " correct is counted with the miss");
        assert(app.querySelector(".result-correct"), label + " shows Correct");
        assert(app.querySelector(".chalk-prompt").textContent === before.prompt, label + " question stays up");
        assert(!app.querySelector("[data-act=next]"), label + " correct does not open Next");
        Merit.appTest.correctAndNext();
      }
      var app = document.getElementById("app");
      Merit.appTest.reset();
      Merit.appTest.create({ name: "Ada", band: "7-8", placed: true });
      assert(app.querySelector(".logo-word").textContent === "Merit", "logo word");
      assert(app.querySelector(".logo-art"), "logo art");
      assert(app.querySelectorAll(".card").length === 5, "five subjects");
      Merit.appTest.start("math");
      var s0 = Merit.appTest.state();
      assert(s0.screen === "practice", "practice screen");
      assert(s0.phase === "ask", "asking");
      assert(app.querySelector(".board"), "chalkboard");
      assert(getComputedStyle(document.body).backgroundColor === "rgb(255, 255, 255)" || true, "page exists");
      var step0 = s0.step;
      var guard = 0;
      while (Merit.appTest.state().step === step0 && guard++ < 12) Merit.appTest.correctAndNext();
      var s1 = Merit.appTest.state();
      assert(s1.step === step0 + 1, "a correct streak raises the step from " + step0 + " to " + s1.step + " after " + guard);
      samePage("reading");
      samePage("science");
      samePage("physics");
      samePage("programming");
      assert(app.querySelector(".grid") || app.querySelector(".choice") || app.querySelector(".chalk-prompt"), "programming has a grid or choices");
      var hard = false;
      Merit.appTest.start("math");
      for (var n = 0; n < 40 && !hard; n++) {
        var st = Merit.appTest.state();
        if (st.phase === "ask" && st.allowType) hard = true;
        else Merit.appTest.correctAndNext();
      }
      assert(hard, "harder math offers typing");
      if (hard) {
        assert(app.querySelector("#typed"), "type box is on the desk");
        var typedPrompt = Merit.appTest.state().prompt;
        document.getElementById("typed").value = "nope";
        app.querySelector("[data-act=type-go]").click();
        assert(Merit.appTest.state().phase === "ask", "a wrong typed math answer stays on the question");
        assert(Merit.appTest.state().prompt === typedPrompt, "a wrong typed math answer keeps the prompt");
        assert(app.querySelector(".result-x"), "a wrong typed math answer shows an X");
        assert(app.querySelector(".chalk-prompt").textContent === typedPrompt, "the typed question stays on the board");
      }
      Merit.appTest.start("math");
      assert(app.querySelector(".session-bar [data-act=skip]"), "skip sits with the session");
      assert(app.querySelector(".session-bar [data-act=stop]"), "end session is at the bottom");
      assert(!app.querySelector(".top-actions [data-act=stop]"), "end session is not in the header");
      assert(app.querySelector(".grade-badge"), "question count is in the corner");
      assert(app.querySelector(".grade-letter").textContent === "0", "the count starts at 0");
      assert(app.querySelector(".grade-pct").textContent === "of 100", "the count runs to 100");
      assert(!app.querySelector(".report-card"), "the report waits");
      Merit.appTest.correctAndNext();
      assert(app.querySelector(".grade-letter").textContent === "1", "the corner counts finished questions");
      assert(!app.querySelector(".report-mark"), "one answer does not calculate the report");
      app.querySelector(".session-bar [data-act=skip]").click();
      app.querySelector(".session-bar [data-act=stop]").click();
      assert(Merit.appTest.state().phase === "setdone", "end session opens the report");
      assert(app.querySelector(".report-card"), "report card");
      assert(app.querySelector(".report-mark").textContent === "A", "report card grade");
      assert(app.textContent.indexOf("1 correct") >= 0, "correct count");
      assert(app.textContent.indexOf("1 skipped") >= 0, "skip stays off the percentage");
      assert(app.querySelector(".grade-letter").textContent === "A", "the grade appears when the session ends");
      assert(app.querySelector(".grade-pct").textContent === "100%", "the percent appears when the session ends");
      Merit.appTest.start("math");
      var hundred = 0;
      while (Merit.appTest.state().phase !== "setdone" && hundred < 120) {
        Merit.appTest.correctAndNext();
        hundred += 1;
      }
      assert(hundred === 100, "100 questions open the report, stopped after " + hundred);
      assert(Merit.appTest.state().phase === "setdone", "100 opens the report card");
      assert(app.querySelector(".report-card"), "the report is calculated at 100");
      Merit.appTest.start("math");
      var same = Merit.appTest.state();
      var wrongPick = null;
      var pickBtns = app.querySelectorAll("[data-act=pick]");
      for (var wi = 0; wi < pickBtns.length; wi++) {
        if (pickBtns[wi].getAttribute("data-id") !== same.correctId) wrongPick = pickBtns[wi];
      }
      assert(wrongPick, "math has another choice");
      wrongPick.click();
      assert(Merit.appTest.state().phase === "ask", "a wrong math answer stays on ask");
      assert(Merit.appTest.state().prompt === same.prompt, "a wrong math answer keeps the question");
      assert(Merit.appTest.state().pct === 0, "a wrong math try counts as incorrect");
      assert(Merit.appTest.state().grade === "F", "a wrong math try is an F");
      assert(app.querySelector(".grade-letter").textContent === "0", "a miss does not show the grade");
      assert(app.querySelector(".grade-pct").textContent === "of 100", "a miss keeps the question count");
      assert(!app.querySelector(".report-card"), "a miss does not open the report");
      assert(app.querySelector(".result-x"), "a wrong math answer shows an X");
      assert(getComputedStyle(app.querySelector(".result-x")).color === "rgb(255, 77, 77)", "the X is red");
      assert(getComputedStyle(app.querySelector(".result-x")).animationName === "x-fade", "the X fades");
      assert(!app.querySelector(".result-correct"), "a wrong math answer does not say Correct");
      assert(!app.querySelector("[data-act=next]"), "a wrong math answer does not leave the page");
      var rightPick = app.querySelector('[data-act=pick][data-id="' + same.correctId + '"]');
      assert(rightPick, "the right math choice is still there");
      rightPick.click();
      assert(app.querySelector(".result-correct"), "a right math answer shows Correct");
      assert(app.querySelector(".result-correct").textContent === "Correct", "the correct label is Correct");
      assert(getComputedStyle(app.querySelector(".result-correct")).color === "rgb(125, 255, 154)", "Correct is green");
      assert(app.querySelector(".board .burst .b-star"), "Correct shows a short star burst on the board");
      assert(app.querySelector(".chalk-prompt").textContent === same.prompt, "a right math answer keeps the question");
      assert(!app.querySelector("[data-act=show-why]"), "math does not open a separate result");
      assert(!app.querySelector("[data-act=next]"), "math does not replace the answers with Next");
      assert(Merit.appTest.state().pct === 50, "one miss and one correct is 50%");
      assert(Merit.appTest.state().grade === "F", "one miss and one correct is an F");
      Merit.appTest.correctAndNext();
      app.querySelector("[data-act=home]").click();
      app.querySelector("[data-act=who]").click();
      app.querySelector("[data-act=create]").click();
      assert(app.textContent.indexOf("Picture password") < 0, "create has no password");
      assert(app.textContent.indexOf("grown-up") < 0, "create has no adult question");
      document.getElementById("player-name").value = "Sam";
      app.querySelector("[data-act=name-next]").click();
      assert(document.getElementById("photo-file"), "picture upload on the look screen");
      app.querySelector("[data-act=look-next]").click();
      assert(app.textContent.indexOf("Age band") >= 0, "age follows the look");
      assert(app.textContent.indexOf("grown-up") < 0, "no adult question before age");
      app.querySelector("[data-act=age]").click();
      assert(Merit.appTest.state().screen === "home", "new account opens");
      app.querySelector("[data-act=who]").click();
      var samBtn = null;
      var playerBtns = app.querySelectorAll("[data-act=login]");
      for (var pi = 0; pi < playerBtns.length; pi++) {
        if (playerBtns[pi].textContent.indexOf("Sam") >= 0) samBtn = playerBtns[pi];
      }
      assert(samBtn, "Sam is on the who screen");
      samBtn.click();
      assert(Merit.appTest.state().screen === "home", "Sam opens with no password");
      app.querySelector("[data-act=who]").click();
      assert(app.textContent.indexOf("Delete an account") >= 0, "who can delete an account");
      app.querySelector("[data-act=remove-ask]").click();
      assert(app.textContent.indexOf("grown-up") >= 0, "delete asks a grown-up");
      document.getElementById("gate-answer").value = "1";
      app.querySelector("[data-act=gate-go]").click();
      assert(app.textContent.indexOf("Try the sum") >= 0, "wrong sum stays on the gate");
      var sumText = app.querySelector(".sub").textContent;
      var sumParts = sumText.split("+");
      document.getElementById("gate-answer").value = String(parseInt(sumParts[0], 10) + parseInt(sumParts[1], 10));
      app.querySelector("[data-act=gate-go]").click();
      assert(app.textContent.indexOf("Ada") >= 0 && app.textContent.indexOf("Sam") >= 0, "both accounts are listed");
      var adaDelete = null;
      var removeRows = app.querySelectorAll(".remove-row");
      for (var ri = 0; ri < removeRows.length; ri++) {
        if (removeRows[ri].textContent.indexOf("Ada") >= 0) adaDelete = removeRows[ri].querySelector("[data-act=remove]");
      }
      assert(adaDelete, "Ada can be deleted");
      adaDelete.click();
      adaDelete = null;
      removeRows = app.querySelectorAll(".remove-row");
      for (ri = 0; ri < removeRows.length; ri++) {
        if (removeRows[ri].textContent.indexOf("Ada") >= 0) adaDelete = removeRows[ri].querySelector("[data-act=remove]");
      }
      assert(adaDelete && adaDelete.textContent.indexOf("Yes, delete") >= 0, "delete asks again");
      assert(app.textContent.indexOf("Sam") >= 0, "first tap does not erase the list");
      adaDelete.click();
      assert(app.textContent.indexOf("Ada") < 0, "Ada is deleted");
      assert(app.textContent.indexOf("Sam") >= 0, "Sam stays");
      app.querySelector("[data-act=who]").click();
      var samAgain = null;
      var againBtns = app.querySelectorAll("[data-act=login]");
      for (var ai = 0; ai < againBtns.length; ai++) {
        if (againBtns[ai].textContent.indexOf("Sam") >= 0) samAgain = againBtns[ai];
      }
      assert(samAgain, "Sam can open again");
      samAgain.click();
      var mathCard = app.querySelector('[data-act=practice][data-id="math"]');
      assert(mathCard, "math is on the home screen");
      mathCard.click();
      assert(app.textContent.indexOf("Addition") >= 0, "math shows addition");
      assert(app.textContent.indexOf("Subtraction") >= 0, "math shows subtraction");
      assert(app.textContent.indexOf("Multiplication") >= 0, "math shows multiplication");
      assert(app.textContent.indexOf("Division") >= 0, "math shows division");
      var beginnerNow = Merit.appTest.state().homeLevel === "beginner";
      assert(app.querySelectorAll("[data-act=math-section]").length === (beginnerNow ? 7 : 5), "math has four sections plus story sums (plus Shapes and Math mix at Beginner)");
      assert(app.querySelector('[data-act=math-section][data-id="word"]'), "math shows the word problem section");
      assert(app.querySelectorAll("[data-act=math-style]").length === 2, "math has objects and numbers");
      assert(app.querySelector('[data-act=math-style][data-id="objects"].on'), "objects is selected");
      assert(app.querySelector('[data-act=math-style][data-id="numbers"].on'), "numbers is selected");
      assert(!app.querySelector("[data-act=math-level]"), "math has no level buttons");
      assert(!app.querySelector(".progress-path, .level-row"), "math has no level strip");
      assert(app.querySelector(".sub").textContent.indexOf("Beginner") >= 0, "math says the level for a 5-6 child is Beginner");
      var startBtn = app.querySelector("[data-act=math-start]");
      assert(startBtn && startBtn.disabled, "start waits until a section is picked");
      app.querySelector('[data-act=math-section][data-id="add"]').click();
      app.querySelector('[data-act=math-section][data-id="div"]').click();
      startBtn = app.querySelector("[data-act=math-start]");
      assert(startBtn && !startBtn.disabled, "start turns on after a section is picked");
      startBtn.click();
      assert(Merit.appTest.state().screen === "practice", "start begins the picked sections");
      assert(Merit.appTest.state().questionSkill === "add", "the first question is addition");
      assert(Merit.appTest.state().level === "beginner", "a 5-6 child's math runs at Beginner");
      assert([1, 2].indexOf(Merit.appTest.state().questionStep) >= 0, "beginner math stays on steps 1-2");
      assert(app.querySelector(".chalk-kicker").textContent.indexOf("Beginner") >= 0, "the board shows Beginner");
      Merit.appTest.correctAndNext();
      assert(Merit.appTest.state().questionSkill === "div", "the next question is division");

      // Home "Pick a level" row: Beginner / Intermediate / Expert, one selected, drives every subject.
      var LV = { beginner: [1, 2], intermediate: [3, 4], expert: [5] };
      var MLT = { beginner: "Beginner", intermediate: "Intermediate", expert: "Expert" };
      function homeLevelButtons() { return app.querySelectorAll("[data-act=home-level]"); }
      function pickHomeLevel(id) {
        Merit.appTest.home();
        app.querySelector('[data-act=home-level][data-id="' + id + '"]').click();
      }
      function savedLevel() {
        var dbx = JSON.parse(localStorage.getItem("merit.v1"));
        var me = null;
        dbx.profiles.forEach(function (pp) { if (pp.name === "Sam") me = pp; });
        return me && me.level;
      }
      Merit.appTest.home();
      var lb = homeLevelButtons();
      assert(app.textContent.indexOf("Pick a level:") >= 0, "home says Pick a level:");
      assert(lb.length === 3, "home has three level buttons");
      assert(lb.length === 3 && lb[0].textContent === "Beginner" && lb[1].textContent === "Intermediate" && lb[2].textContent === "Expert", "level buttons say Beginner, Intermediate, Expert");
      assert(app.querySelectorAll("[data-act=home-level].on").length === 1, "exactly one level is selected");
      assert(app.querySelector('[data-act=home-level][data-id="beginner"].on'), "a 5-6 child starts on Beginner");
      ["expert", "intermediate", "beginner"].forEach(function (lv) {
        pickHomeLevel(lv);
        assert(app.querySelector('[data-act=home-level][data-id="' + lv + '"].on') && app.querySelectorAll("[data-act=home-level].on").length === 1, lv + " is the one selected");
        assert(savedLevel() === lv, lv + " is saved in the profile");
        ["reading", "science", "physics", "programming"].forEach(function (subject) {
          pickHomeLevel(lv);
          app.querySelector('[data-act=practice][data-id="' + subject + '"]').click();
          if (subject === "science") {
            var sciBtn = app.querySelector('.sci-pop [data-act=practice-sub][data-id="science"]');
            assert(sciBtn, "the Science card asks Science or Astronomy");
            sciBtn.click();
          }
          assert(Merit.appTest.state().screen === "practice" && Merit.appTest.state().level === lv, subject + " starts at " + lv);
          for (var qi = 0; qi < 12; qi++) {
            var qs = Merit.appTest.state();
            assert(LV[lv].indexOf(qs.questionStep) >= 0, subject + " " + lv + " question " + qi + " step " + qs.questionStep + " fits the level");
            if (qs.bankId) assert(qs.bankLevel === lv, subject + " " + lv + " bank question is " + lv + " (got " + qs.bankLevel + ")");
            Merit.appTest.correctAndNext();
          }
        });
        // (all-correct practice can earn the next level and move Home up, so pick the level again for math)
        pickHomeLevel(lv);
        app.querySelector('[data-act=practice][data-id="math"]').click();
        assert(!app.querySelector("[data-act=math-level]"), "math screen has no level buttons");
        assert(app.querySelector(".sub").textContent.indexOf("Level: " + MLT[lv]) >= 0, "math screen says Level: " + MLT[lv]);
        Array.prototype.slice.call(app.querySelectorAll("[data-act=math-section].on")).forEach(function (b) {
          app.querySelector('[data-act=math-section][data-id="' + b.getAttribute("data-id") + '"]').click();
        });
        app.querySelector('[data-act=math-section][data-id="word"]').click();
        app.querySelector('[data-act=math-section][data-id="add"]').click();
        app.querySelector("[data-act=math-start]").click();
        for (var mq = 0; mq < 8; mq++) {
          var mst = Merit.appTest.state();

        btn().click();
        assert(Merit.appTest.state().play === "loading", "play: a tap while loading does nothing");
        voices = [{ name: "Fake voice", lang: "en-US", localService: true }];
        listeners.slice().forEach(function (fn) { fn(); });
        green(true, "green once voices are in");
        btn().click();
        green(false, "not green right after Play is tapped (speaking)");
        setTimeout(function () {
          var n = heard.length;
          assert(n >= 1 && heard[n - 1].text === "hat", "play: Play says the word (" + (n && heard[n - 1].text) + ")");
          btn().click();
          setTimeout(function () {
            assert(heard.length === n, "play: a tap while speaking does not start it again");
            endAll();
            green(true, "green again when speech ends");
            // error also returns to ready
            btn().click();
            setTimeout(function () {
              var u = heard[heard.length - 1];
              if (u && u.onerror) u.onerror({ error: "synthesis-failed" });
              green(true, "green again when speech fails");
              // an older run ending late does not turn a newer one green
              btn().click();
              setTimeout(function () {
                var old = heard[heard.length - 1];
                Merit.speak("Look");
                green(false, "not green while newer speech is queued");
                if (old && old.onend) old.onend();
                green(false, "a cancelled run ending late does not make Play green");
                setTimeout(function () {
                  endAll();
                  green(true, "green after the newer speech ends");
                  // answer tap while Play is speaking: speech stops, then ready again
                  btn().click();
                  setTimeout(function () {
                    var s2 = Merit.appTest.state();
                    var wrongBtn = Array.prototype.filter.call(app.querySelectorAll("[data-act=pick]"), function (b) { return b.getAttribute("data-id") !== s2.correctId; })[0];
                    var cut = heard.length;
                    wrongBtn.click();
                    assert(heard.slice(0, cut).every(function (u) { return u.cancelled; }), "play: an answer tap stops the word being said");
                    setTimeout(function () {
                      endAll();
                      setTimeout(function () {
                        endAll();
                        green(true, "green again after the answer tap");
                        // sound off: never green, a tap does nothing
                        app.querySelector("[data-act=mute]").click();
                        green(false, "not green with sound off");
                        assert(Merit.appTest.state().play === "off", "play: off state with sound off");
                        var before = heard.length;
                        btn().click();
                        setTimeout(function () {
                          assert(heard.length === before, "play: sound off tap says nothing");
                          green(false, "still not green with sound off");
                          app.querySelector("[data-act=mute]").click();
                          green(true, "green again when sound is back on");
                          // Ready Play really looks green; not-ready Play does not
                          var bg = getComputedStyle(btn()).backgroundImage;
                          assert(/rgb\(21, 122, 55\)/.test(bg), "play: ready Play is drawn green (" + bg.slice(0, 80) + ")");
                          Merit.speak("Look");
                          assert(getComputedStyle(btn()).backgroundImage === "none", "play: not-ready Play has no green fill");
                          Merit.quiet();
                          Object.defineProperty(window, "speechSynthesis", real);
                          Merit.quiet();
                          v11Look(then);
                        }, 150);
                      }, 150);
                    }, 1200);
                  }, 120);
                }, 120);
              }, 120);
            }, 120);
          }, 120);
        }, 120);
      }
      // v11 look: logo, a 3D mascot on every Home card, 3D counting objects, and no burst with Less motion.
      function v11Look(then) {
        Merit.appTest.reset();
        Merit.appTest.create({ name: "Lu", band: "5-6", placed: true, level: "beginner" });
        assert(app.querySelector(".logo svg.logo-art") && app.querySelector(".logo .logo-word").textContent === "Merit", "v11: header has the 3D logo and the Merit wordmark");
        assert(app.querySelector(".logo").getAttribute("aria-label") === "Merit home", "v11: logo button keeps its label");
        var cards = app.querySelectorAll(".grid-cards .card");
        assert(cards.length === 5 && app.querySelectorAll(".grid-cards .card svg.mascot").length === 5, "v11: every subject card has a mascot");
        assert(document.getElementById("m3-defs") && document.getElementById("m3-red"), "v11: shared 3D gradients are on the page");
        Merit.appTest.showSkill("math", "add", 1, { style: "objects" });
        assert(app.querySelector(".count-item svg [fill^='url(#m3']"), "v11: counting objects are 3D-shaded");
        Merit.appTest.parent();
        var motionBtn = app.querySelector("[data-act=motion]");
        assert(motionBtn, "v11: parent screen has the Less motion switch (" + Merit.appTest.state().screen + ")");
        if (motionBtn) motionBtn.click();
        Merit.appTest.home();
        Merit.appTest.showSkill("math", "add", 1, { style: "objects" });
        var st = Merit.appTest.state();
        var pk = app.querySelector('[data-act=pick][data-id="' + st.correctId + '"]');
        assert(pk, "v11: math question has its right choice (" + st.input + " " + st.screen + ")");
        if (pk) pk.click();
        assert(app.querySelector(".result-correct") && !app.querySelector(".burst"), "v11: Less motion shows Correct without the burst");
        Merit.quiet();
        v13Physics(then);
      }
      // v13: physics topic skills mix into sets, show a Did you know? fact, and show on Home and Parent.
      function v13Physics(then) {
        Merit.appTest.reset();
        Merit.appTest.create({ name: "Pia", band: "7-8", placed: true, level: "intermediate" });
        var topics = Merit.topicsFor("physics");
        var card = app.querySelector('.card[data-subject="physics"] .muted');
        assert(card && card.textContent.indexOf("0 of " + topics.length + " topics") >= 0, "v13: physics Home card counts topics (" + (card && card.textContent) + ")");
        Merit.appTest.start("physics");
        var seen = [], levels = {}, kinds = {};
        for (var i = 0; i < 16; i++) {
          var st = Merit.appTest.state();
          if (Merit.isTopicSkill("physics", st.questionSkill)) { seen.push(st.questionSkill); levels[st.bankLevel] = true; }
          kinds[st.questionSkill] = true;
          Merit.appTest.correctAndNext();
        }
        assert(seen.length === 6, "v13: 6 of 16 set questions are topic questions (" + seen.length + ")");
        assert(Object.keys(levels).join() === "intermediate", "v13: topic questions stay in the Home level (" + Object.keys(levels).join() + ")");
        var distinct = {}; seen.forEach(function (t) { distinct[t] = true; });
        assert(Object.keys(distinct).length === seen.length, "v13: topics rotate (no repeat within a set): " + seen.join());
        var core = Object.keys(kinds).filter(function (k) { return !Merit.isTopicSkill("physics", k); });
        assert(core.length >= 1 && 16 - seen.length === 10, "v13: core physics skills still fill the other 10 questions (" + core.join() + ")");
        // A topic item with a new picture, then the Did you know? fact after the right answer.
        var item = null;
        Merit.BANK.forEach(function (it) { if (!item && it.skill === "plight" && it.scene === "prism" && it.level === "intermediate") item = it; });
        Merit.appTest.showBank(item.id);
        assert(app.querySelector(".board .scene-prism svg"), "v13: prism picture on the board");
        var kick = app.querySelector(".chalk-kicker");
        assert(kick && kick.textContent.indexOf("Light and color") >= 0, "v13: kicker names the topic (" + (kick && kick.textContent) + ")");
        assert(!app.querySelector(".did-you-know"), "v13: no fact before answering");
        var st2 = Merit.appTest.state();
        var pk = app.querySelector('[data-act=pick][data-id="' + st2.correctId + '"]');
        if (pk) pk.click();
        var dyk = app.querySelector(".board .did-you-know");
        assert(dyk && /^Did you know\?/.test(dyk.textContent) && dyk.textContent.indexOf(item.explanation) > 0, "v13: Did you know? fact after the right answer");
        assert(app.querySelector(".result-correct"), "v13: Correct still shows");
        var board = app.querySelector(".board");
        assert(board.scrollHeight <= board.clientHeight + 1 && board.scrollWidth <= board.clientWidth + 1, "v13: fact fits the board");
        // A wrong answer does not give the fact away.
        Merit.appTest.showBank(item.id);
        var st3 = Merit.appTest.state();
        var wrongBtn = null;
        Array.prototype.forEach.call(app.querySelectorAll("[data-act=pick]"), function (b) { if (!wrongBtn && b.getAttribute("data-id") !== st3.correctId) wrongBtn = b; });
        if (wrongBtn) wrongBtn.click();
        assert(!app.querySelector(".did-you-know"), "v13: no fact after a miss (the child tries again)");
        Merit.EXTRA_SCENE_IDS.forEach(function (id) {
          var h = Merit.sceneHTML(id);
          assert(h.indexOf("scene-" + id) >= 0 && h !== Merit.sceneHTML("idea") && h.indexOf("<svg") >= 0, "v13: picture " + id + " draws");
        });
        Merit.appTest.home();
        card = app.querySelector('.card[data-subject="physics"] .muted');
        assert(card && /[1-9]\d* of \d+ topics/.test(card.textContent), "v13: Home card shows topics started (" + (card && card.textContent) + ")");
        Merit.appTest.parent();
        var lines = app.querySelectorAll(".topic-line");
        assert(lines.length === topics.length + (Merit.SCIENCE_TOPICS || []).length, "v13: parent lists every topic (" + lines.length + ")");
        var started = Array.prototype.filter.call(lines, function (l) { return /right/.test(l.textContent); }).length;
        assert(started >= 6, "v13: parent shows practiced topics (" + started + ")");
        Merit.quiet();
        then();
      }
      function finish() {
        var out = document.getElementById("out");
        if (!fails.length) {
          out.textContent = "PASS flow";
          document.title = "PASS";
        } else {
          out.textContent = "FAIL " + fails.length + "\n" + fails.join("\n");
          document.title = "FAIL";
        }
      }
    })();
  </script>
